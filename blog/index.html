<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog — Alireza Kiaee</title>
  <meta name="description" content="Writing on full-stack engineering, ERP integrations, and building production software." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { ink: '#09090B', primary: '#18181B', muted: '#3F3F46', accent: '#2563EB', paper: '#FAFAFA' },
        fontFamily: { display: ['Archivo','sans-serif'], body: ['"Space Grotesk"','sans-serif'] } } }
    };
  </script>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="bg-paper text-ink font-body antialiased selection:bg-accent selection:text-white">
  <div class="grain" aria-hidden="true"></div>

  <header class="fixed top-4 left-4 right-4 z-50">
    <nav class="mx-auto max-w-6xl flex items-center justify-between rounded-2xl border border-black/[0.06] bg-white/70 backdrop-blur-xl px-5 py-3 shadow-[0_8px_30px_rgb(0,0,0,0.06)]">
      <a href="/" class="font-display font-extrabold text-lg cursor-pointer">AK<span class="text-accent">.</span></a>
      <ul class="hidden md:flex items-center gap-8 text-sm font-medium text-muted">
        <li><a class="hover:text-ink transition-colors duration-200 cursor-pointer" href="/#work">Work</a></li>
        <li><a class="hover:text-ink transition-colors duration-200 cursor-pointer" href="/#about">About</a></li>
        <li><a class="hover:text-ink transition-colors duration-200 cursor-pointer" href="/#experience">Experience</a></li>
        <li><a class="text-ink cursor-pointer" href="/blog">Blog</a></li>
        <li><a class="hover:text-ink transition-colors duration-200 cursor-pointer" href="/#contact">Contact</a></li>
      </ul>
      <a href="/#contact" class="hidden md:inline-flex items-center gap-2 rounded-full bg-ink text-white text-sm font-medium px-5 py-2.5 hover:bg-accent transition-colors duration-300 cursor-pointer">Let's talk</a>
    </nav>
  </header>

  <main class="px-4 sm:px-6 lg:px-8 pt-32 pb-24 max-w-6xl mx-auto">
    <p class="text-sm font-medium tracking-widest uppercase text-accent mb-3">Blog</p>
    <h1 class="font-display font-black tracking-tight text-[clamp(2.5rem,7vw,5rem)] leading-none">Writing &amp; notes</h1>
    <p class="mt-4 max-w-xl text-lg text-muted leading-relaxed">Thoughts on full-stack engineering, ERP integrations, and building production software.</p>

    <div id="tag-bar" class="mt-8 flex flex-wrap gap-2"></div>

    <div id="post-grid" class="mt-10 grid grid-cols-1 md:grid-cols-3 gap-6"></div>
    <p id="empty-state" class="hidden mt-16 text-center text-muted">No posts published yet — check back soon.</p>
    <div class="mt-12 flex justify-center">
      <button id="load-more" class="hidden btn-ghost rounded-full border border-ink/15 px-6 py-3 text-sm font-medium hover:border-accent hover:text-accent transition-colors duration-300 cursor-pointer">Load more</button>
    </div>
  </main>

  <footer class="border-t border-black/[0.06] px-4 sm:px-6 lg:px-8 py-8">
    <div class="mx-auto max-w-6xl flex flex-col sm:flex-row items-center justify-between gap-4 text-sm text-muted">
      <p>© 2026 Alireza Kiaee. Crafted with care.</p>
      <a href="/" class="inline-flex items-center gap-2 hover:text-accent transition-colors duration-200 cursor-pointer">Back home</a>
    </div>
  </footer>

<script>
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params = new URLSearchParams(location.search);
let page = 1;
const limit = 9;
let activeTag = params.get('tag') || '';
const seenTags = new Set();

function cardHtml(p) {
  const date = p.published_at ? new Date(p.published_at).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }) : '';
  const cover = p.cover_image
    ? `<img src="${esc(p.cover_image)}" alt="" class="w-full h-full object-cover" loading="lazy" />`
    : `<div class="w-full h-full bg-gradient-to-br from-ink to-muted"></div>`;
  return `
  <a href="/blog/${esc(p.slug)}" class="group rounded-3xl overflow-hidden border border-black/[0.06] bg-white cursor-pointer block hover:shadow-[0_24px_60px_-20px_rgb(9,9,11,0.15)] transition-shadow duration-300">
    <div class="aspect-[4/3] overflow-hidden">${cover}</div>
    <div class="p-6">
      ${date ? `<p class="text-xs font-medium uppercase tracking-widest text-muted mb-2">${date}</p>` : ''}
      <h2 class="font-display font-bold text-xl tracking-tight group-hover:text-accent transition-colors duration-300">${esc(p.title)}</h2>
      <p class="mt-2 text-sm text-muted leading-relaxed line-clamp-3">${esc(p.excerpt)}</p>
    </div>
  </a>`;
}

function renderTagBar() {
  const bar = document.getElementById('tag-bar');
  const chips = [...seenTags].sort().map(t => {
    const on = t === activeTag;
    const href = on ? '/blog' : `/blog?tag=${encodeURIComponent(t)}`;
    return `<a href="${href}" class="rounded-full border px-3.5 py-1.5 text-xs font-medium transition-colors duration-200 cursor-pointer ${on ? 'bg-ink text-white border-ink' : 'border-ink/15 text-muted hover:border-accent hover:text-accent'}">#${esc(t)}</a>`;
  });
  bar.innerHTML = chips.join('');
}

async function loadPage() {
  const url = `/api/posts?page=${page}&limit=${limit}${activeTag ? `&tag=${encodeURIComponent(activeTag)}` : ''}`;
  const res = await fetch(url);
  const data = await res.json();
  const grid = document.getElementById('post-grid');
  if (page === 1) grid.innerHTML = '';
  grid.insertAdjacentHTML('beforeend', data.posts.map(cardHtml).join(''));
  data.posts.forEach(p => (p.tags || []).forEach(t => seenTags.add(t)));
  renderTagBar();
  document.getElementById('empty-state').classList.toggle('hidden', !(page === 1 && data.posts.length === 0));
  document.getElementById('load-more').classList.toggle('hidden', !data.hasMore);
}

document.getElementById('load-more').addEventListener('click', () => { page += 1; loadPage(); });
loadPage();
</script>
</body>
</html>
